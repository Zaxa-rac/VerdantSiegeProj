# waves.cfg — Verdant Siege wave definitions
# Format: wave <n> beetles <n> mosquitoes <n> sludge <n>
# Boss waves (multiples of 5) are injected automatically by WaveManager.
# Lines starting with # are comments.

wave 1  beetles 4  mosquitoes 0  sludge 0
wave 2  beetles 5  mosquitoes 1  sludge 0
wave 3  beetles 6  mosquitoes 2  sludge 1
wave 4  beetles 7  mosquitoes 2  sludge 1
# wave 5 is auto-generated as a ScorpionMech boss wave
wave 6  beetles 8  mosquitoes 3  sludge 2
wave 7  beetles 9  mosquitoes 4  sludge 2
wave 8  beetles 10 mosquitoes 4  sludge 3
wave 9  beetles 11 mosquitoes 5  sludge 3
# wave 10 is auto-generated as a ScorpionMech boss wave
# Waves beyond 10 use procedural fallback scaling
