# settings.cfg — Verdant Siege difficulty settings
# Active difficulty is selected from the main menu; only one block
# should be uncommented at a time, or modify the values below directly.

# ── Normal (default) ──────────────────────────────────────────────────────────
difficulty_name  Normal
speed_mult       1.0
enemy_count_add  0
player_hp        100

# ── Easy ──────────────────────────────────────────────────────────────────────
# difficulty_name  Easy
# speed_mult       0.7
# enemy_count_add  -2
# player_hp        150

# ── Hard ──────────────────────────────────────────────────────────────────────
# difficulty_name  Hard
# speed_mult       1.4
# enemy_count_add  3
# player_hp        75
